<!--
  Splash / store-size icon, 512px nominal (#407). Same mark as
  icon-192.svg at a larger nominal size, and the og:image the link
  previews use.

  The two files are kept separate rather than one being reused at both
  sizes because the manifest declares explicit `sizes` entries, and a
  launcher picks the closest match rather than scaling whatever it finds.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Rhythma">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aa3bff" />
      <stop offset="1" stop-color="#7e14ff" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#ground)" />

  <g transform="translate(256 256) scale(2.667) translate(-96 -96)">
    <path
      fill="#ffffff"
      d="M104.5 158.4c-2.6 3.3-7.9 1.5-7.9-2.7v-40.2a8.8 8.8 0 0 0-8.8-8.8H45.3c-3.6 0-5.7-4.1-3.6-7l29.2-40.9c4.2-5.8 0-14-7.2-14H41.2c-3.6 0-5.7-4-3.6-7L71 33.6c.8-1.2 2.2-1.9 3.6-1.9h55.3c3.6 0 5.7 4.1 3.6 7l-29.2 40.9c-4.2 5.9 0 14 7.2 14h34.4c3.7 0 5.8 4.2 3.5 7.1z"
    />
  </g>
</svg>
