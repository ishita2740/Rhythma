name: Landing Page CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'landing-page/**'
      - '.github/workflows/landing-page.yml'
  push:
    branches: [main]
    paths:
      - 'landing-page/**'
      - '.github/workflows/landing-page.yml'

defaults:
  run:
    working-directory: landing-page

jobs:
  landing-page-checks:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: landing-page/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
