name: Web CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'

defaults:
  run:
    working-directory: web

jobs:
  web-checks:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Lint and build are type/syntax checks — neither executes a line of
      # application logic, which is why a runtime bug like #259 (a call to an
      # endpoint the backend does not serve) stayed green through both all
      # the way onto main. This step is the one that runs the code.
      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
